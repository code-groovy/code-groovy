name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: xvfb-run -a node ./out/test/runTest.js

      - name: Package
        run: npx vsce package --out code-groovy.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: code-groovy-vsix
          path: code-groovy.vsix
          retention-days: 7
