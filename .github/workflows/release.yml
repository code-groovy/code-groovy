name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build release package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 11

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "$GITHUB_REF_NAME" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Check tagged commit is on master
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tagged commit $GITHUB_SHA is not on master"
            exit 1
          fi

      - name: Check CHANGELOG has an entry for this version
        run: grep -q "^## \[${{ steps.version.outputs.version }}\]" CHANGELOG.md

      - run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: xvfb-run -a node ./out/test/runTest.js

      - name: Package
        run: npx vsce package --out "code-groovy-${{ steps.version.outputs.version }}.vsix"

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: code-groovy-${{ steps.version.outputs.version }}.vsix
          retention-days: 30

  publish:
    name: Publish to marketplaces
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: marketplace
      url: https://marketplace.visualstudio.com/items?itemName=marlon407.code-groovy
    env:
      VSIX: code-groovy-${{ needs.build.outputs.version }}.vsix
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce@3 publish --packagePath "$VSIX" --skip-duplicate

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT is not configured; skipping Open VSX"
            exit 0
          fi
          npx ovsx@1.2.0 publish "$VSIX" --pat "$OVSX_PAT" --skip-duplicate

  github-release:
    name: Create GitHub release
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: vsix

      - name: Extract release notes from CHANGELOG
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "code-groovy-$VERSION.vsix" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
